# Qdrant vector database for the handbook assistant.
#   docker compose up -d          start (data persists in the qdrant_data volume)
#   docker compose down           stop  (add -v to also delete the stored vectors)
services:
  qdrant:
    image: qdrant/qdrant:v1.20.1
    container_name: handbook-qdrant
    ports:
      - "6333:6333"   # REST API + dashboard at http://localhost:6333/dashboard
      - "6334:6334"   # gRPC
    volumes:
      - qdrant_data:/qdrant/storage
    restart: unless-stopped

volumes:
  qdrant_data:
